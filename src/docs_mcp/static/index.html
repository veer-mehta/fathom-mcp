<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>docs-rag</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --border: #262b36;
    --text: #e6e9ef;
    --muted: #8b93a5;
    --accent: #6ea8fe;
    --good: #4ade80;
    --bad: #f87171;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.55 -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .wrap { max-width: 900px; margin: 0 auto; padding: 24px 16px 80px; }
  h1 { font-size: 22px; margin: 0 0 4px; letter-spacing: .3px; }
  h1 span { color: var(--accent); }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 24px; }
  .card {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 10px; padding: 16px; margin-bottom: 16px;
  }
  label { font-size: 12px; color: var(--muted); display: block; margin-bottom: 4px; }
  input {
    width: 100%; padding: 9px 11px; border-radius: 7px; color: var(--text);
    background: #0d0f14; border: 1px solid var(--border); font-size: 14px;
  }
  input:focus { outline: none; border-color: var(--accent); }
  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  .row > * { flex: 1; min-width: 120px; }
  button {
    background: var(--accent); color: #0b1220; border: 0; border-radius: 7px;
    padding: 9px 18px; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  button:hover { filter: brightness(1.1); }
  button:disabled { opacity: .5; cursor: wait; }
  button.ghost {
    background: transparent; color: var(--muted); border: 1px solid var(--border);
    padding: 4px 10px; font-size: 12px; font-weight: 500;
  }
  button.ghost:hover { color: var(--bad); border-color: var(--bad); filter: none; }
  .filters { margin-top: 10px; }
  select {
    width: 100%; padding: 9px 11px; border-radius: 7px; color: var(--text);
    background: #0d0f14; border: 1px solid var(--border); font-size: 14px;
  }
  select:focus { outline: none; border-color: var(--accent); }
  .hit { border-top: 1px solid var(--border); padding: 14px 2px; }
  .hit:first-child { border-top: 0; }
  .hit-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .score {
    background: rgba(110,168,254,.12); color: var(--accent);
    font-size: 12px; padding: 2px 8px; border-radius: 99px; font-weight: 600;
  }
  .crumb { color: var(--muted); font-size: 12px; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .content {
    margin-top: 8px; white-space: pre-wrap; color: #c6ccd8;
    font-size: 13.5px; max-height: 260px; overflow-y: auto;
    border-left: 2px solid var(--border); padding-left: 12px;
  }
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  th { color: var(--muted); text-align: left; font-weight: 500; padding: 6px 8px; }
  td { padding: 8px; border-top: 1px solid var(--border); }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  .status { font-size: 13px; margin-top: 10px; color: var(--muted); min-height: 18px; }
  .status.ok { color: var(--good); }
  .status.err { color: var(--bad); }
  .empty { color: var(--muted); text-align: center; padding: 22px 0; font-size: 14px; }
  details summary { cursor: pointer; color: var(--muted); font-size: 13px; user-select: none; }
</style>
</head>
<body>
<div class="wrap">
  <h1>docs<span>-rag</span></h1>
  <div class="sub">semantic search over crawled framework documentation</div>

  <div style="margin:12px 0 0; display:flex; align-items:center; gap:10px; font-size:13px">
    <span style="color:var(--muted)">backend</span>
    <select id="backend" style="flex:0; min-width:280px">
      <option value="rag">RAG — direct pipeline access</option>
      <option value="mcp">MCP — tool calls through docs-mcp server</option>
    </select>
  </div>

  <div class="card">
    <form id="searchForm">
      <label for="q">Search documentation</label>
      <div class="row">
        <input id="q" placeholder="e.g. how do I define a model with validated fields" autofocus>
        <button style="flex:0">Search</button>
      </div>
      <details class="filters">
        <summary>filters &amp; options</summary>
        <div class="row" style="margin-top:10px">
          <div><label>framework name</label><input id="fname" placeholder="pydantic"></div>
          <div><label>version</label><input id="fver" placeholder="2.13"></div>
          <div><label>results (k)</label><input id="fk" type="number" value="5" min="1" max="20"></div>
          <div>
            <label>mode</label>
            <select id="fmode">
              <option value="hybrid">hybrid (vector + keyword)</option>
              <option value="vector">vector only</option>
              <option value="keyword">keyword only</option>
            </select>
          </div>
        </div>
      </details>
    </form>
    <div id="searchStatus" class="status"></div>
    <div id="hits"></div>
  </div>

  <div class="card">
    <table>
      <thead><tr><th>indexed sources</th><th class="num">pages</th><th class="num">chunks</th><th>updated</th><th></th></tr></thead>
      <tbody id="sourceRows"><tr><td colspan="5" class="empty">loading…</td></tr></tbody>
    </table>
  </div>

  <div class="card">
    <details>
      <summary>+ add documentation source</summary>
      <form id="ingestForm" style="margin-top:12px">
        <div class="row">
          <div><label>name *</label><input id="iname" placeholder="pydantic" required></div>
          <div><label>version *</label><input id="iver" placeholder="2.13" required></div>
        </div>
        <div class="row" style="margin-top:10px">
          <div style="flex:3"><label>documentation url *</label><input id="iurl" placeholder="https://docs.pydantic.dev/latest/" required></div>
          <div><label>max depth</label><input id="idepth" type="number" value="2" min="0" max="5"></div>
          <div><label>max pages</label><input id="ipages" type="number" value="30" min="1" max="300"></div>
        </div>
        <div style="margin-top:12px; display:flex; align-items:center; gap:14px">
          <button>Ingest</button>
          <label style="display:flex; align-items:center; gap:6px; color:var(--muted); font-size:13px">
            <input type="checkbox" id="iprune"> remove pages missing from re-crawl
          </label>
        </div>
      </form>
      <div id="ingestStatus" class="status"></div>
    </details>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const api = () => ($("backend").value === "mcp" ? "/mcp" : "");
const via = () => `via ${$("backend").value.toUpperCase()}`;

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => (
    {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]
  ));
}

async function doSearch(ev) {
  ev.preventDefault();
  const q = $("q").value.trim();
  if (!q) return;
  $("searchStatus").textContent = "searching…";
  $("searchStatus").className = "status";
  $("hits").innerHTML = "";
  try {
    const params = new URLSearchParams({
      q,
      k: $("fk").value || 5,
      mode: $("fmode").value || "hybrid",
    });
    if ($("fname").value.trim()) params.set("name", $("fname").value.trim());
    if ($("fver").value.trim()) params.set("version", $("fver").value.trim());
    const res = await fetch(api() + "/search?" + params);
    if (!res.ok) throw new Error((await res.json()).error || res.status);
    const data = await res.json();
    $("searchStatus").textContent =
      data.hits.length ? `${data.hits.length} result(s) · ${via()}` : `no matches · ${via()}`;
    $("hits").innerHTML = data.hits.map(h => {
      const score = h.similarity != null ? h.similarity.toFixed(2) : (h.bm25_score ?? 0).toFixed(4);
      return `
      <div class="hit">
        <div class="hit-head">
          <span class="score">${score}</span>
          <a href="${esc(h.url)}" target="_blank">${esc(h.title || h.url)}</a>
        </div>
        ${h.heading_path.length ? `<div class="crumb">${esc(h.heading_path.join(" › "))}</div>` : ""}
        <div class="content">${esc(h.content)}</div>
      </div>`;
    }).join("");
  } catch (err) {
    $("searchStatus").textContent = "error: " + err.message;
    $("searchStatus").className = "status err";
  }
}

async function loadSources() {
  const tbody = $("sourceRows");
  const mcpMode = $("backend").value === "mcp";
  try {
    const res = await fetch(api() + "/sources");
    const data = await res.json();
    if (!data.sources.length) {
      tbody.innerHTML = `<tr><td colspan="5" class="empty">nothing indexed yet — add a source below</td></tr>`;
      return;
    }
    tbody.innerHTML = data.sources.map(s => `
      <tr>
        <td>${esc(s.source_id)}</td>
        <td class="num">${s.pages}</td>
        <td class="num">${s.chunks}</td>
        <td style="color:var(--muted)">${esc(String(s.updated_at || "").slice(0, 16).replace("T", " "))}</td>
        <td style="text-align:right">
          ${mcpMode
            ? `<span style="color:var(--muted);font-size:12px" title="delete is only available via the RAG backend">—</span>`
            : `<button class="ghost" onclick="deleteSource('${esc(s.source_id)}')">delete</button>`}
        </td>
      </tr>`).join("");
  } catch {
    tbody.innerHTML = `<tr><td colspan="5" class="empty">failed to load sources (${via()})</td></tr>`;
  }
}

async function deleteSource(id) {
  if (!confirm(`Delete all indexed chunks for "${id}"?`)) return;
  await fetch("/sources/" + encodeURIComponent(id), { method: "DELETE" });
  loadSources();
}

async function doIngest(ev) {
  ev.preventDefault();
  const btn = $("ingestForm").querySelector("button");
  const status = $("ingestStatus");
  btn.disabled = true;
  status.className = "status";
  status.textContent = "submitting job…";
  try {
    const res = await fetch(api() + "/ingest", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        name: $("iname").value.trim(),
        version: $("iver").value.trim(),
        base_url: $("iurl").value.trim(),
        max_depth: parseInt($("idepth").value) || 2,
        max_pages: parseInt($("ipages").value) || 30,
        background: true,
        prune_missing: $("iprune").checked,
      }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || res.status);
    await pollJob(data.job_id, status, btn);
  } catch (err) {
    status.className = "status err";
    status.textContent = "error: " + err.message;
    btn.disabled = false;
  }
}

async function pollJob(jobId, status, btn) {
  for (;;) {
    let res, job;
    try {
      res = await fetch("/jobs/" + encodeURIComponent(jobId));
      job = await res.json();
    } catch (err) {
      status.className = "status err";
      status.textContent = "polling failed: " + err.message;
      btn.disabled = false;
      return;
    }
    if (job.status === "queued" || job.status === "running") {
      status.className = "status";
      status.textContent =
        `job ${jobId} ${job.status} — crawled ${job.pages_crawled}, ` +
        `indexed ${job.pages_indexed} pages, ${job.chunks_indexed} chunks`;
    } else if (job.status === "done") {
      status.className = "status ok";
      const r = job.result || {};
      const extra = [];
      if (r.pages_unchanged) extra.push(`${r.pages_unchanged} unchanged skipped`);
      if (r.pages_removed) extra.push(`${r.pages_removed} removed`);
      status.textContent =
        `indexed ${r.pages_indexed}/${r.pages_crawled} pages, ` +
        `${r.chunks_indexed} chunks (${r.source_id})` +
        (extra.length ? ` · ${extra.join(", ")}` : "");
      btn.disabled = false;
      loadSources();
      return;
    } else {
      status.className = "status err";
      status.textContent = `job ${jobId} failed: ${job.error || "unknown"}`;
      btn.disabled = false;
      return;
    }
    await new Promise((resolve) => setTimeout(resolve, 1500));
  }
}

$("searchForm").addEventListener("submit", doSearch);
$("ingestForm").addEventListener("submit", doIngest);
$("backend").addEventListener("change", loadSources);
loadSources();
</script>
</body>
</html>
